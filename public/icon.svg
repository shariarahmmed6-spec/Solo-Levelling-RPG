<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="60%" stop-color="#080e1b"/>
      <stop offset="100%" stop-color="#04070d"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0052ff"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#70f3ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Outer Hologram Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.4" stroke-dasharray="16 8"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.6"/>

  <!-- Rune Hexagon / Shield Frame -->
  <polygon points="256,68 396,148 396,310 256,410 116,310 116,148" fill="#0b1526" stroke="url(#cyanGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Tech Wing Accents -->
  <path d="M140 180 L200 240 L160 270 Z" fill="#00e5ff" opacity="0.6"/>
  <path d="M372 180 L312 240 L352 270 Z" fill="#00e5ff" opacity="0.6"/>

  <!-- Central Dagger / Blade (Solo Leveling System Motif) -->
  <!-- Blade -->
  <path d="M256 96 L276 250 L256 320 L236 250 Z" fill="url(#bladeGrad)" filter="url(#glow)"/>
  <line x1="256" y1="96" x2="256" y2="320" stroke="#ffffff" stroke-width="3"/>

  <!-- Dagger Crossguard -->
  <path d="M210 316 L256 304 L302 316 L292 334 L256 326 L220 334 Z" fill="#00e5ff" filter="url(#glow)"/>

  <!-- Grip & Pommel -->
  <rect x="251" y="330" width="10" height="42" rx="4" fill="#1b2a4a"/>
  <polygon points="256,376 264,386 256,396 248,386" fill="url(#cyanGrad)" filter="url(#glow)"/>

  <!-- System Level Rune Text 'SL' -->
  <text x="256" y="445" font-family="'Courier New', monospace" font-size="26" font-weight="900" fill="#00e5ff" text-anchor="middle" letter-spacing="4" filter="url(#glow)">SYSTEM</text>
</svg>
